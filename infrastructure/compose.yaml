name: racing-platform
services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: racing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_local.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup_local.py}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?Run setup_local.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d racing"]
      interval: 3s
      timeout: 3s
      retries: 20
  db-test:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    profiles: ["test"]
    environment:
      POSTGRES_DB: racing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_local.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup_local.py}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?Run setup_local.py}
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    volumes:
      - ./postgres/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d racing_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://racing_app:${APP_DB_PASSWORD}@db:5432/racing
      SMTP_HOST: mailpit
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  mail-worker:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://racing_app:${APP_DB_PASSWORD}@db:5432/racing
      SMTP_HOST: mailpit
    command: ["python", "-m", "app.services.mail_worker"]
    depends_on:
      db: {condition: service_healthy}
  migrate:
    build: ../backend
    profiles: ["tools"]
    env_file: ../backend/.env
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://racing_owner:${OWNER_DB_PASSWORD}@db:5432/racing
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
